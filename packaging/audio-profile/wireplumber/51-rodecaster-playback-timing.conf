# Diagnostic: use hardware interrupts instead of timer scheduling for RODE playback.
# Remove this file and restart WirePlumber to undo.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.usb-.*RODECaster_Pro_II.*" }
    ]
    actions = {
      update-props = {
        api.alsa.disable-tsched = true
      }
    }
  }
]
