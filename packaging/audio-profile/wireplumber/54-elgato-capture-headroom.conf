# Match the card rather than its PCI address or changing ALSA card number.
monitor.alsa.rules = [
  {
    matches = [
      {
        media.class = "Audio/Source"
        alsa.driver_name = "sc0710"
        alsa.card_name = "Elgato 4K60 Pro MK.2"
      }
    ]
    actions = {
      update-props = {
        api.alsa.headroom = 2048
      }
    }
  }
]
