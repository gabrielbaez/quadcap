# Keep line-input preamps at unity even when an application requests 100% volume.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.pci-.*"
        device.vendor.id = "0x1022"
        device.product.id = "0x15e3"
      }
    ]
    actions = {
      update-props = {
        device.profile-set = "quadcap-alc1220.conf"
      }
    }
  }
]
