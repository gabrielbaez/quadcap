# Prefer the listening device over the Elgato capture clock in connected mixes.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.usb-.*RODECaster_Pro_II.*HiFi__Speaker__sink" }
    ]
    actions = {
      update-props = {
        priority.driver = 3000
      }
    }
  }
]
